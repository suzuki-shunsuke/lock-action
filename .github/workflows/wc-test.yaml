---
name: Test
on:
  workflow_call:
    inputs:
      sha:
        description: The commit SHA where the action was built
        required: true
        type: string

jobs:
  test-1:
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{inputs.sha}}
          persist-credentials: false
      # The action built by the release job
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Unlock test-1
        uses: ./
        with:
          mode: unlock
          key: test-1
      - name: Lock test-1
        uses: ./
        with:
          mode: lock
          key: test-1
          post_unlock: "true"
          max_wait_seconds: "30"
          wait_interval_seconds: "5"
      - name: Check test-1
        uses: ./
        id: check
        with:
          mode: check
          key: test-1
      - name: Check the output of check step
        run: echo "$OUTPUTS"
        env:
          OUTPUTS: ${{toJSON(steps.check.outputs)}}

  test-2:
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{inputs.sha}}
          persist-credentials: false
      # The action built by the release job
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Check test-2
        uses: ./
        id: check
        with:
          mode: check
          key: test-2
      - name: Check the output of check step
        run: echo "$OUTPUTS"
        env:
          OUTPUTS: ${{toJSON(steps.check.outputs)}}
      - name: Lock test-2
        uses: ./
        with:
          mode: lock
          key: test-2
          max_wait_seconds: "30"
          wait_interval_seconds: "5"
      - name: Remove test-2
        uses: ./
        with:
          mode: unlock
          key: test-2
          remove_key_when_unlock: "true"
      - name: Remove test-2 again
        uses: ./
        with:
          mode: unlock
          key: test-2
          remove_key_when_unlock: "true"
